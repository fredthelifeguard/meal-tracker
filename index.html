<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meal Tracker</title>
  <meta name="description" content="Personal protein and fiber tracker">
  <meta name="theme-color" content="#FFF4E6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1D130C" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Meals">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view"></main>

  <nav class="tabs" aria-label="Sections">
    <button type="button" data-tab="today" aria-current="page">Today</button>
    <button type="button" data-tab="gotos">Go-tos</button>
    <button type="button" data-tab="health" hidden>Health</button>
    <button type="button" data-tab="settings">Settings</button>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <section id="printArea" aria-hidden="true"></section>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
